name: Infra · Terraform

# Regla: en PR -> fmt/validate/plan (revisión). En merge a main -> apply con
# aprobación manual (GitHub Environment 'infra-apply' con required reviewers).
on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"

concurrency:
  group: infra-terraform
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: write # para comentar el plan en el PR

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: DEBUG · claims del token OIDC
        working-directory: .
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          PAYLOAD="${PAYLOAD}$(printf '%*s' $(( (4 - ${#PAYLOAD} % 4) % 4 )) '' | tr ' ' '=')"
          echo "$PAYLOAD" | base64 -d 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print('SUB:', d.get('sub')); print('REPO:', d.get('repository')); print('REF:', d.get('ref'))"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"

      - name: Credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate -no-color

      - name: Plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt

      - name: Resumen del plan en el PR
        if: always()
        run: |
          {
            echo "## 📋 Terraform Plan"
            echo ""
            echo '```'
            grep -E "Plan:|will be|must be" plan.txt | head -40 || echo "sin cambios"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar el plan
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan
          retention-days: 5

  apply:
    # Solo en merge a main, y tras aprobación manual del environment.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: plan
    runs-on: ubuntu-latest
    environment: infra-apply # configurar required reviewers en GitHub
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"

      - name: Credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: terraform init -input=false

      - name: Descargar el plan aprobado
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra

      - name: Apply
        run: terraform apply -input=false -no-color tfplan

      - name: Resumen del apply
        if: always()
        run: |
          {
            echo "## ✅ Terraform Apply aplicado"
            echo ""
            terraform output -no-color 2>/dev/null || echo "(sin outputs)"
          } >> "$GITHUB_STEP_SUMMARY"
