name: Consulta citas DIAN

# TEMPORAL: cada 30 min, todos los días. GitHub retrasa/omite crons gratuitos,
# así que la frecuencia real será menor (por eso migraremos a EventBridge+Lambda).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Ejecutar en dry-run (no envía a Telegram)"
        type: boolean
        default: false

concurrency:
  group: dian-citas
  cancel-in-progress: false

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Cachea el navegador para no descargarlo en cada corrida (ahorra tiempo).
      - name: Cache de navegador Playwright
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium

      - name: Instalar Chromium
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps chromium
          else
            python -m playwright install --with-deps chromium
          fi

      # Restaura estado + histórico de la corrida anterior.
      - name: Restaurar estado
        uses: actions/cache@v4
        with:
          path: state
          key: dian-state-${{ github.run_id }}
          restore-keys: |
            dian-state-

      - name: Consultar disponibilidad
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DIAN_TIPO_ATENCION: Videoatención
          DIAN_CATEGORIA: Devoluciones
          DIAN_CIUDAD: Medellín
          TZ: America/Bogota
          NOTIFY_MODE: always
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m dian_bot.main --dry-run
          else
            python -m dian_bot.main --once
          fi

      - name: Guardar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: dian-state-${{ github.run_id }}

      # Publica el histórico como artefacto descargable para analizar el patrón.
      - name: Publicar histórico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-${{ github.run_id }}
          path: state/history.jsonl
          if-no-files-found: ignore
          retention-days: 30
